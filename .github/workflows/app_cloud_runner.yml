
name: Application Cloud Automation Engine

on:
  workflow_dispatch:
  repository_dispatch:

jobs:
  execute-selenium-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository Content
        uses: actions/checkout@v4

      - name: Deploy Java JDK 17 Virtual Environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Google Chrome Headless Binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # NEW DIAGNOSTIC STEP
      - name: Compare Java source files
        run: |
          echo "ROOT LEVEL FILE:"
          grep -n "NEW BUILD" ApplicationTrackerFrmExcel.java || true

          echo "MAVEN SOURCE FILE:"
          grep -n "NEW BUILD" src/main/java/com/automation/tracker/ApplicationTrackerFrmExcel.java || true

          echo "CHECKING SOURCE FILES:"
          git status --short

      # EXISTING MAVEN EXECUTION
      - name: Run Data Driven Selenium Framework Execution
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: mvn -B clean compile exec:java -Dexec.mainClass="com.automation.tracker.ApplicationTrackerFrmExcel"
