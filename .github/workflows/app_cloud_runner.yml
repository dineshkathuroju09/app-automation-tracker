
name: Application Cloud Automation Engine

on:
  workflow_dispatch:
  repository_dispatch:

jobs:
  execute-selenium-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository Content
        uses: actions/checkout@v4

      - name: Deploy Java JDK 17 Virtual Environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Google Chrome Headless Binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # ADD THE NEW CODE HERE
      - name: Inspect Maven source file
        run: |
          echo "Workspace:"
          pwd

          echo "Maven source contents:"
          sed -n '30,48p' src/main/java/com/automation/tracker/ApplicationTrackerFrmExcel.java

          echo "Search marker in tracked files:"
          git grep -n "NEW BUILD" -- '*.java' || true

          echo "Latest commit affecting Maven source:"
          git log -1 --format='%h %ad %s' --date=iso -- src/main/java/com/automation/tracker/ApplicationTrackerFrmExcel.java

          echo "Tracked source path:"
          git ls-files --stage src/main/java/com/automation/tracker/ApplicationTrackerFrmExcel.java

      # YOUR EXISTING MAVEN STEP REMAINS BELOW
      - name: Run Data Driven Selenium Framework Execution
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: mvn -B clean compile exec:java -Dexec.mainClass="com.automation.tracker.ApplicationTrackerFrmExcel"
